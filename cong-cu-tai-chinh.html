<body data-page="finance">
<main><section class="phero"><div class="container"><div class="crumbs"><a href="index.html">Trang chủ</a> / AI thực chiến</div><h1>🧮 Công cụ tài chính</h1><p>Tính khoản vay ngân hàng và ước tính lợi suất cho thuê / ROI đầu tư. Số liệu chỉ mang tính tham khảo.</p></div></section><div class="container calc">
<div class="glass-card" id="loanF"><h3>Tính khoản vay mua nhà</h3><label>Giá trị BĐS (tỷ đồng)</label><input class="field" id="lPrice" type="number" step="0.1" min="0.1"><label>Tỷ lệ vay: <b id="lRatioV"></b></label><input id="lRatio" type="range" min="10" max="80" value="70"><label>Lãi suất (%/năm)</label><input class="field" id="lRate" type="number" step="0.1" value="9.5"><label>Thời hạn vay</label><select class="field" id="lYears"><option value="10">10 năm</option><option value="15">15 năm</option><option value="20" selected>20 năm</option><option value="25">25 năm</option></select><div class="out" id="lOut"></div><div id="lChart"></div></div>
<div class="glass-card" id="roiF"><h3>Lợi suất cho thuê & ROI</h3><label>Giá mua (tỷ đồng)</label><input class="field" id="rPrice" type="number" step="0.1"><label>Giá thuê (triệu/tháng)</label><input class="field" id="rRent" type="number"><label>Tỷ lệ lấp đầy (%)</label><input class="field" id="rOcc" type="number" value="90"><label>Chi phí vận hành (% doanh thu)</label><input class="field" id="rCost" type="number" value="15"><label>Tăng giá kỳ vọng (%/năm)</label><input class="field" id="rGrowth" type="number" value="7"><label>Thời gian nắm giữ (năm)</label><input class="field" id="rYears" type="number" value="5"><div class="out" id="rOut"></div></div></div></main>
